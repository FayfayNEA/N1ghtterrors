        </div>    
    </div>
        <script>
            window.addEventListener('scroll', function() {
                const scrollPercent = window.scrollY / (document.body.scrollHeight - window.innerHeight);
                const video = document.getElementById('fmyVideo');
                const intro = document.querySelector('.intro');
                const scrollHint = document.querySelector('.scroll-hint'); // Added this
                
                if (scrollPercent > 0.2) {
                    video.classList.add('fade');
                    intro.classList.add('active');
                    if(scrollHint) scrollHint.style.opacity = "0"; // Hide scroll text
                } else {
                    video.classList.remove('fade');
                    intro.classList.remove('active');
                    if(scrollHint) scrollHint.style.opacity = "1"; // Show scroll text
                }
            });
        </script>
