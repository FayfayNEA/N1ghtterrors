        <script>
            document.querySelector('.intro').addEventListener('wheel', function(e) {
                // Let the scroll event bubble up to the window
                window.scrollBy(0, e.deltaY);
            }, { passive: false });

            window.addEventListener('scroll', function() {
                const scrollPercent = window.scrollY / (document.body.scrollHeight - window.innerHeight);
                const video = document.getElementById('fmyVideo');
                const intro = document.querySelector('.intro');
                const instructionText = document.querySelector('.instruction-text');
                
                if (scrollPercent > 0.2) {
                    video.classList.add('fade');
                    intro.classList.add('active');
                    instructionText.classList.add('active');
                } else {
                    video.classList.remove('fade');
                    intro.classList.remove('active');
                    instructionText.classList.remove('active');
                }
            });
        </script>
