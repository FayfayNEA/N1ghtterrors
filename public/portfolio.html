<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shes sooooooo sad </title>
    <link href="/css/styles.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://use.typekit.net/art4fxf.css">
    <link rel="icon" type="image/png" href="/images/buckingbronc.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            font-family: 'Kumbh Sans', sans-serif;
        }
        
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background-color: black;
            padding: 12px 20px;
            display: flex;
            align-items: center;
        }
        
        .back-button {
            background-color: black;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 50;
            font-family: "chandler-42-regular", sans-serif;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        
        .back-button:hover {
             opacity: 10%;
             cursor:pointer; 
        }
        
        .pdf-viewer {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/shop" class="back-button">Back to Home</a>
        </div>
        <iframe src="/WorkSampleJune.pdf" class="pdf-viewer"></iframe>
    </div>
</body>
</html>
