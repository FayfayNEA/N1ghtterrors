<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shes sooooooo sad </title>
    <link href="/css/styles.css" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://use.typekit.net/art4fxf.css">
    <link rel="icon" type="image/png" href="/images/buckingbronc.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            color: white;
            font-family: "chandler-42-regular", sans-serif;
        }
        
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            padding: 40px;
            display: flex;
            justify-content: flex-start;
        }
        
        .back-button{
            color: white;
            text-decoration: none;
            font-size: 16px;
            border: none;
            padding: 10px 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background: white;
            color: black;
            cursor: pointer;
        }
        
        .pdf-viewer {
            flex: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/shop" class="back-button">← BACK TO SHOP ←</a>
        </div>
        <iframe src="/WorkSampleJune.pdf" class="pdf-viewer"></iframe>
    </div>
</body>
</html>
